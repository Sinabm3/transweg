services:
  backend:
    build:
      context: ./backend
    container_name: transweg-backend
    environment:
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:-nabhandanial@gmail.com}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      REVIEWS_ADMIN_TOKEN: ${REVIEWS_ADMIN_TOKEN}
    volumes:
      - reviews-data:/data/reviews
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: transweg-frontend
    ports:
      - '${APP_PORT:-8081}:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  reviews-data:
