spring.application.name=transweg-backend

server.port=8080

# Generic SMTP relay - works with Gmail (App Password), or any SMTP provider.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Where contact form submissions are sent, and what the "from" address shows.
contact.recipient-email=${CONTACT_RECIPIENT_EMAIL:sinabm3@gmail.com}
contact.from-email=${MAIL_FROM:${spring.mail.username}}

# Browser origins allowed to call the API directly (comma-separated). Only
# needed when the frontend is not served behind the same nginx/domain.
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Shared secret required (as the X-Admin-Token header) to delete a review.
# Leave unset to disable deletion entirely.
reviews.admin-token=${REVIEWS_ADMIN_TOKEN:}

# File-based H2 database for public reviews. Mounted as a volume in
# docker-compose so data survives redeploys.
spring.datasource.url=jdbc:h2:file:${REVIEWS_DB_PATH:/data/reviews}/reviewsdb;AUTO_SERVER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
